server {
    # Ascender ships job events here over omhttp.  TLS terminates in this
    # container, so the bearer token and event payloads are encrypted in
    # transit.  The certificate is the same host certificate as the web UI.
    listen 5000 ssl;

    server_name parser.local;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html;

    ssl_certificate     /etc/nginx/certs/ledger.crt;
    ssl_certificate_key /etc/nginx/certs/ledger.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # One job event per request, but package_facts for a large host can be several megabytes,
    # and nginx refuses anything over 1m by default.
    client_max_body_size 64m;

    location / {
        index parse.php;
    }
    location ~ /(LICENSE\.txt|composer\.lock|composer\.json|nginx\.conf|web\.config|htaccess\.txt|\.htaccess|\.gitignore|\.git) {
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # ^~ makes these win over the \.php$ location below.  Without it a regex location takes
    # precedence, and /vendor/*.php or /includes/*.php would be run directly.
    location ^~ /templates/ {
        return 404;
    }

    location ^~ /includes/ {
        return 404;
    }

    location ^~ /utility/ {
        return 404;
    }

    location ^~ /vendor/ {
        return 404;
    }

    rewrite  ^/(.+)$                        /parse.php break;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
