version: '3.9'

services:
  ledger-web:
    container_name: ledger-web
    build:
      dockerfile: dockerfiles/web-dockerfile
      context: .
    image: ghcr.io/ctrliq/ascender-ledger/ledger-web
    ports:
      - '${LEDGER_HTTP_PORT:-80}:80'
      - '${LEDGER_HTTPS_PORT:-443}:443'
    environment:
      MYSQL_LEDGER_PASSWORD: /run/secrets/db-ledger-password
    networks:
      ledger:
    secrets:
      - db-ledger-password
      - firstkey
      - secondkey
    volumes:
      - ./src/:/var/www/html
      # TLS certificate and key, created by scripts/gen-certs.sh.
      - ./certs:/etc/nginx/certs:ro
      # The src bind mount would hide the vendor directory built into the
      # image.  A named volume is seeded from the image on first use.
      - ledger-vendor:/var/www/html/vendor
    depends_on:
      - ledger-db
  ledger-parser:
    container_name: ledger-parser
    build:
      dockerfile: dockerfiles/parser-dockerfile
      context: .
    image: ghcr.io/ctrliq/ascender-ledger/ledger-parser
    ports:
      - '5000:5000'
    environment:
      MYSQL_LEDGER_PASSWORD: /run/secrets/db-ledger-password
    networks:
      ledger:
    secrets:
      - db-ledger-password
    volumes:
      - ./src/:/var/www/html
      - ./certs:/etc/nginx/certs:ro
      - ledger-vendor:/var/www/html/vendor

    depends_on:
      - ledger-db

  ledger-db:
    container_name: ledger-db
    build:
      dockerfile: dockerfiles/db-dockerfile
      context: .
    image: ghcr.io/ctrliq/ascender-ledger/ledger-db
    environment:
      MYSQL_LEDGER_PASSWORD: /run/secrets/db-ledger-password
      ADMIN_USER: admin
      admin-password: /run/secrets/admin-password
    networks:
      ledger:
        aliases:
          - db
    secrets:
      - db-ledger-password
      - admin-password
    # Local only: the other containers reach the database over the compose network
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  ledger-vendor:

secrets:
   admin-password:
     file: ./secrets/admin_password.txt
   db-ledger-password:
     file: ./secrets/db_ledger_password.txt
   firstkey:
     file: ./secrets/firstkey.txt
   secondkey:
     file: ./secrets/secondkey.txt

networks:
  ledger: